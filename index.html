<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8fc">
  <meta name="description" content="Organizá tus tareas personales, elegí prioridades y seguí tu progreso con Margen.">
  <link rel="icon" href="./margen.svg" type="image/svg+xml">
  <title>Mis tareas · Margen</title>
</head>
<body>
  <header class="topbar"><div class="wrap nav">
    <div class="brand"><img src="./margen.svg" alt="" width="34" height="34">Margen</div>
    <span class="nav-divider"></span><span class="workspace">Organizador personal</span>
    <time id="today"></time>
  </div></header>
  <main class="wrap">
    <div class="heading"><h1>Mis tareas<span>.</span></h1><button id="new" class="primary"><b aria-hidden="true">＋</b> Nueva tarea</button></div>
    <section class="overview" aria-labelledby="summary-title">
      <div class="summary-content"><h2 id="summary-title">Resumen de progreso</h2>
        <div class="progress"><strong id="percent">0%</strong><span>completado</span></div>
        <progress id="progress" value="0" max="100" aria-label="Porcentaje de tareas completadas"></progress>
        <p id="summary-count"></p>
      </div>
      <div class="art" aria-hidden="true"><div class="book-shadow"></div><div class="book"><i class="binding"></i><i class="band"></i><div class="book-label"><b>✓</b><i></i><i></i></div><i class="ribbon"></i></div></div>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="panel-head"><h2 id="list-title">Lista de tareas</h2><span class="total" id="total"></span></div>
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="Filtrar por estado">
          <button data-status="todas" aria-pressed="true">Todas</button>
          <button data-status="pendientes" aria-pressed="false">Pendientes</button>
          <button data-status="completadas" aria-pressed="false">Completadas</button>
        </div>
        <div class="filter-fields">
          <label class="search"><span class="magnifier" aria-hidden="true"></span><input type="search" id="search" aria-label="Buscar por título" placeholder="Buscar por título"></label>
          <select id="priority-filter" aria-label="Filtrar por prioridad"><option value="">Toda prioridad</option><option>Alta</option><option>Media</option><option>Baja</option></select>
        </div>
      </div>
      <p id="load-error" role="alert" hidden></p>
      <ul id="tasks"></ul>
      <div id="empty" class="empty" hidden><span class="empty-icon" aria-hidden="true">✓</span><h3 id="empty-title"></h3><p id="empty-text"></p><button id="empty-action" class="secondary"></button></div>
      <p class="list-foot" id="results" aria-live="polite"></p>
    </section>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><form id="task-form">
    <div class="dialog-head"><h2 id="editor-title">Nueva tarea</h2><button type="button" class="close" aria-label="Cerrar">×</button></div>
    <label>Título<input name="title" required maxlength="120" placeholder="Que se hara ahora" autofocus></label>
    <label>Descripción<textarea name="description" required maxlength="1200" rows="3" placeholder="Agregá los detalles de la tarea"></textarea></label>
    <div class="form-pair">
      <label>Categoría<input name="category" list="categories" required maxlength="40" placeholder="Ej. Estudio"></label>
      <datalist id="categories"><option>Estudio</option><option>Trabajo</option><option>Personal</option></datalist>
      <label>Prioridad<select name="priority"><option>Alta</option><option selected>Media</option><option>Baja</option></select></label>
    </div>
    <p class="form-error" id="editor-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="secondary cancel">Cancelar</button><button class="primary" id="save" type="submit">Crear tarea</button></div>
  </form></dialog>
  <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message"><form id="delete-form">
    <h2 id="confirm-title">¿Eliminar tarea?</h2><p id="confirm-message"></p>
    <p class="form-error" id="delete-error" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="secondary cancel" autofocus>Cancelar</button><button type="submit" class="danger">Eliminar</button></div>
  </form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
